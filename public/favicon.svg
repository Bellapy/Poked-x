<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="55%" stop-color="#e0249c" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#e0249c" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="top" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7a5c"/>
      <stop offset="55%" stop-color="#ff2d55"/>
      <stop offset="100%" stop-color="#c81232"/>
    </linearGradient>

    <linearGradient id="bottom" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#cfc7e6"/>
    </linearGradient>

    <linearGradient id="sheen" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.75"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>

  <!-- Aura da paleta do site. Pulsa onde o navegador anima favicon (Firefox);
       onde não anima, fica parada e o ícone continua legível. -->
  <circle cx="32" cy="32" r="31" fill="url(#aura)">
    <animate attributeName="r" values="27;31;27" dur="2.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="0.7;1;0.7" dur="2.6s" repeatCount="indefinite"/>
  </circle>

  <circle cx="32" cy="32" r="25" fill="url(#bottom)"/>
  <path d="M7 32a25 25 0 0 1 50 0Z" fill="url(#top)"/>

  <!-- Brilho especular que percorre a bola. -->
  <path d="M14 22a21 21 0 0 1 18-10 21 21 0 0 0-14 16Z" fill="url(#sheen)">
    <animateTransform attributeName="transform" type="rotate"
      from="0 32 32" to="360 32 32" dur="4s" repeatCount="indefinite"/>
  </path>

  <path d="M7 32h50" stroke="#160f22" stroke-width="5"/>
  <circle cx="32" cy="32" r="9.5" fill="#160f22"/>
  <circle cx="32" cy="32" r="6.2" fill="#ffffff"/>
  <circle cx="32" cy="32" r="2.8" fill="#e0249c">
    <animate attributeName="fill" values="#e0249c;#ff8a3d;#8b7bff;#e0249c"
      dur="3.2s" repeatCount="indefinite"/>
  </circle>
  <circle cx="32" cy="32" r="25" fill="none" stroke="#160f22" stroke-width="3.5"/>
</svg>
